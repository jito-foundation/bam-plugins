[package]
name = "bam-maker-client"
version = "0.1.0"
edition = "2024"

[features]
default = ["testnet"]
testnet = []
tokio = ["dep:tokio", "dep:reqwest"]

[[example]]
name = "send_wire_transaction"

[[example]]
name = "send_wire_transaction_async"
required-features = ["tokio"]

[dependencies]
ureq = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"], optional = true }
reqwest = { version = "0.12", optional = true }

[dev-dependencies]
mockito = "1"
